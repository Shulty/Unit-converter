    <div class="converter">
        <div class="converter__head">
            <h1 class="converter__title">
                Метрические / Имперские величины
            </h1>
            <input type="number" class="converter__input" size="8" value="20">
            <button class="converter__convert-btn">
                Перевести
            </button>
        </div>
        <div class="converter__body">
            <div class="converter__element">
                <h2 class="converter__element-title">
                    Длина (Метры/Футы)
                </h2>
                <p class="converter__element-conversion">
                    20 метр = 65.616 фут | 20 фут = 6.096 метр
                </p>
            </div>
            <div class="converter__element">
                <h2 class="converter__element-title">
                    Обьём (Литры/Галоны)
                </h2>
                <p class="converter__element-conversion">
                    20 литр = 5.284 галон | 20 галон = 75.708 литр
                </p>
            </div>
            <div class="converter__element">
                <h2 class="converter__element-title">
                    Масса (Килограммы/Фунты)
                </h2>
                <p class="converter__element-conversion">
                    20 кг = 44.092 фунт | 20 фунт = 9.072 кг
                </p>
            </div>
        </div>
    </div>
